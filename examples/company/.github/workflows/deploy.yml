# Builds the site with its content and puts it online on Cloudflare: after every change to the code, and when the
# content repository asks (see README.md), which it does after each publish.
#
# It needs these secrets (Settings → Secrets and variables → Actions):
# - CLOUDFLARE_API_TOKEN, a token made from Cloudflare's "Edit Cloudflare Workers" template, which can also apply the
#   database's migrations, and CLOUDFLARE_ACCOUNT_ID, the account it's for.
# - GOODFELLOW_CONTENT_KEY, if the content repository is private: the private half of a deploy key that can only read
#   it, whose public half is added to the content repository (Settings → Deploy keys, without write access).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time, the newest waiting rather than each in turn.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The site's content, in content-repository/, as on a developer's computer.
      - uses: actions/checkout@v5
        with:
          repository: your-name/your-site-content
          path: content-repository
          ssh-key: ${{ secrets.GOODFELLOW_CONTENT_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npx goodfellow-next content copy
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: worker
          path: |
            dist/
            .wrangler/deploy/
          include-hidden-files: true
          retention-days: 1

  # Runs none of the site's code, so the Cloudflare token never meets it: it only applies the database's migrations
  # and uploads what the build job built, with wrangler.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: worker
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm
      # .npmrc's ignore-scripts=true keeps every package's install scripts from running.
      - run: npm ci
      # Each migration that hasn't run yet, before the code that needs it is online.
      - run: npx wrangler d1 migrations apply goodfellow-company --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
