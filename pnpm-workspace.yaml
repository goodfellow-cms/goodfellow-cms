packages:
  - "packages/*"
  - "templates/*"
  - "examples/*"
  - "docs"
  - "e2e"

overrides:
  # Cloudflare's browser library depends on Puppeteer's browser downloader, which
  # the connector never runs (Workers use Browser Rendering's browsers) and
  # which brings in extract-zip and basic-ftp, both with security advisories.
  "@cloudflare/puppeteer>@puppeteer/browsers": "-"
  # Puck renders rich text on the server with @tiptap/html, which asks for
  # happy-dom 20. Only 21.0.4 and later fix GHSA-834v-8h66-3h79, and the few
  # calls tiptap makes (a Window with scripts and loading turned off) work the same.
  "@puckeditor/core>happy-dom": "^21.0.4"
  # Expo's code signing asks for node-forge 1.4.0; 1.4.1 fixes GHSA-86w9-cpqp-85rv.
  "@expo/code-signing-certificates>node-forge": "^1.4.1"
  # Express, which the MCP SDK uses, asks for qs 6.16.0; 6.16.1 fixes GHSA-6pq8-jhm2-2vcw.
  "express>qs": "^6.16.1"
  # Sigstore's packages (cacache and @tufjs/models) and Expo's tools ask for glob 13
  # and minimatch 10; glob 14.0.2 fixes GHSA-3g3m-2fjr-6pw4 and minimatch 11.0.1
  # fixes GHSA-g3hv-75wg-m249, and both keep the functions they call.
  "glob@<14.0.2": "^14.0.2"
  "minimatch@<11.0.1": "^11.0.1"

auditConfig:
  ignoreGhsas:
    # Zod 3, which Expo's command line uses to read its own settings, has no
    # fixed release (only Zod 4.6.6 has the fix), and it never reads visitors'
    # or editors' input.
    - GHSA-mrhx-c7xc-m3w5
    # deepmerge has no fixed release; Expo's config tools merge only the
    # app's own settings with it.
    - GHSA-gcqx-w48m-w2h4

peerDependencyRules:
  allowedVersions:
    "@tiptap/html>happy-dom": "21"
