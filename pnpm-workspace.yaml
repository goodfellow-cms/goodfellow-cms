packages:
  - "packages/*"
  - "templates/*"
  - "examples/*"
  - "docs"
  - "e2e"

overrides:
  # Cloudflare's browser library depends on Puppeteer's browser downloader, which
  # the connector never runs (Workers use Browser Rendering's browsers) and
  # which brings in extract-zip and basic-ftp, both with security advisories.
  "@cloudflare/puppeteer>@puppeteer/browsers": "-"
  # Expo's CLI and its code signing ask for node-forge 1.4.0 and up; 1.4.3 fixes GHSA-86w9-cpqp-85rv,
  # GHSA-6cv4-p8m7-4r25, GHSA-j8rw-jp99-435v, GHSA-6889-vf6x-f3g5, and the TLS advisories with them.
  "node-forge@<1.4.3": "^1.4.3"
  # Express, which the MCP SDK uses, asks for qs 6.16.0; 6.16.1 fixes GHSA-6pq8-jhm2-2vcw.
  "express>qs": "^6.16.1"
  # Sigstore's packages (cacache and @tufjs/models) and Expo's tools ask for glob 13
  # and minimatch 10; glob 14.0.2 fixes GHSA-3g3m-2fjr-6pw4 and minimatch 11.0.1
  # fixes GHSA-g3hv-75wg-m249, and both keep the functions they call.
  "glob@<14.0.2": "^14.0.2"
  "minimatch@<11.0.1": "^11.0.1"
  # satori, which vinext's Open Graph images use in the company example, asks for fflate 0.7.3; 0.7.5 fixes
  # GHSA-px8p-9vwx-vf98.
  "fflate@<0.7.5": "^0.7.5"
  # Expo's command line asks for Zod 3, which has no fix for GHSA-mrhx-c7xc-m3w5; Zod 4.6.6 has it. Expo uses
  # Zod only for its dev tools plugins' schemas (objects, strings, enums, arrays, unions), which Zod 4 reads the same
  # way, and nothing in this repository runs Expo's command line.
  "@expo/cli>zod": "^4.6.6"

auditConfig:
  ignoreGhsas:
    # deepmerge has no fixed release; Expo's config tools merge only the
    # app's own settings with it.
    - GHSA-gcqx-w48m-w2h4

peerDependencyRules:
  allowedVersions:
    # @tiptap/html 3.31, which Puck renders rich text with, asks for happy-dom 20;
    # 3.32 and later accept 21 too.
    "@tiptap/html>happy-dom": "21"

# Install scripts that never run: esbuild and workerd, which wrangler and the company example's Cloudflare build
# use, bring their programs as packages for each platform, so neither needs its own.
allowBuilds:
  esbuild: false
  workerd: false
