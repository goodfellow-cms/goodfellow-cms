name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Playwright's image has every browser the end-to-end tests use, with their system packages, which
    # `playwright install --with-deps` took up to an hour to download from Ubuntu's mirror. Its tag is
    # @playwright/test's version in e2e/package.json, which the step before the tests checks.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the image has this Playwright's browsers
        run: |
          for dir in $(pnpm --filter @goodfellow-cms/e2e exec playwright install --dry-run chromium firefox webkit | sed -n 's/^ *Install location: *//p'); do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir isn't in the image: change the job's container to Playwright's image for the @playwright/test version in e2e/package.json"
              exit 1
            fi
          done
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 7
