name: CI

on:
  push:
    branches: [master]
  pull_request:
    # As GitHub's default, and when a draft is marked ready, so its Claude review runs.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to a pull request replaces its run; every commit on master keeps its own, since releases wait for them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Known security advisories in every package the workspace installs, from the lockfile, in a job of its own
  # so a new advisory doesn't hide the other checks' results. Fix one with an override in pnpm-workspace.yaml,
  # or, where no fixed release exists, list it in auditConfig.ignoreGhsas there with the reason.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
      - run: pnpm audit

  # The company example on Postgres, built with `next build` alone, as it would be on Vercel with Neon: a check that
  # nothing outside lib/env.ts and lib/db/dialect.ts knows it's built for Cloudflare's Workers and D1 elsewhere.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@goodfellow-cms/example-company^...
      - name: Apply the migrations
        working-directory: examples/company
        run: npm run migrate
      - name: Build with next build
        working-directory: examples/company
        run: pnpm exec goodfellow-next finish --server && pnpm exec next build
      # The sign-in tests run on SQLite and, with DATABASE_URL, on Postgres.
      - name: Run the unit tests
        working-directory: examples/company
        run: pnpm exec vitest run

  check:
    runs-on: ubuntu-latest
    # A run takes 20 to 35 minutes; one that hangs, such as on a server that never starts, stops well before GitHub's six hours.
    timeout-minutes: 60
    # Playwright's image has every browser the end-to-end tests use, with their system packages, which
    # `playwright install --with-deps` took up to an hour to download from Ubuntu's mirror. Its tag is
    # @playwright/test's version in e2e/package.json, which the step before the tests checks.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the image has this Playwright's browsers
        run: |
          for dir in $(pnpm --filter @goodfellow-cms/e2e exec playwright install --dry-run chromium firefox webkit | sed -n 's/^ *Install location: *//p'); do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir isn't in the image: change the job's container to Playwright's image for the @playwright/test version in e2e/package.json"
              exit 1
            fi
          done
      # Streamed as it runs, rather than Turbo's way on Actions of printing a task's output once it ends, so a run
      # stopped at the time limit still shows which test it was in.
      - run: pnpm test:e2e --log-order=stream
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 7

  # Claude's review, once everything else has passed, so it never reads code that's about to change to fix CI. It
  # reviews a pull request once by itself; see claude-review.yml for asking again, and the labels that change it.
  claude-review:
    needs: [audit, check, postgres]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/claude-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
