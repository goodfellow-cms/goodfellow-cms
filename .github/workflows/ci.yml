name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Playwright's image has every browser the end-to-end tests use, with their system packages, which
    # `playwright install --with-deps` took up to an hour to download from Ubuntu's mirror. Its tag is
    # @playwright/test's version in e2e/package.json, which the step before the tests checks.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute
      options: --user 1001
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the image has this Playwright's browsers
        run: |
          for dir in $(pnpm --filter @goodfellow-cms/e2e exec playwright install --dry-run chromium firefox webkit | sed -n 's/^ *Install location: *//p'); do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir isn't in the image: change the job's container to Playwright's image for the @playwright/test version in e2e/package.json"
              exit 1
            fi
          done
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 7
