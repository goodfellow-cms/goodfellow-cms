# Stages the packages on npm once CI passes on master, if master has a version npm
# doesn't have yet, waits for a maintainer to approve them (`pnpm release:approve`),
# then tags the release and updates the docs site. Versions only change when the
# pull request from `pnpm release:version` is merged, so other changes to master
# publish nothing. See RELEASING.md.
#
# npm accepts this workflow through trusted publishing (each package's settings on
# npmjs.com name this repository and release.yml, for staged publishing only), or
# an NPM_TOKEN secret.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Only after CI passed on a push to master (not a pull request from a branch that happens to be called master).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # whether CI passed, for runs started from the Actions tab
      id-token: write # trusted publishing, and provenance
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      waiting: ${{ steps.publish.outputs.waiting }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The commit CI passed on, even if master has moved on since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # A run started from the Actions tab releases master as it is now, so it waits for CI there too,
      # as the runs CI starts do. Re-running an earlier run releases that run's own commit.
      - if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq .total_count)
          if [ "$passed" = "0" ]; then
            message="CI hasn't passed on ${SHA:0:7} yet. Once it has, this workflow runs for it by itself, so there's no need to start it."
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      # Staged publishing needs npm 11.15.0 or later; Node 22 comes with npm 10. An exact release, so what publishes
      # doesn't change between releases by itself; Dependabot can't see it here, so move it on by hand.
      - run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - id: publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Without the secret, npm signs in with trusted publishing. npm reads the token from the environment.
          if [ -n "$NPM_TOKEN" ]; then echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$HOME/.npmrc"; fi
          node scripts/release.mjs publish --ci

  # Staged versions aren't published until a maintainer approves them. This checks every minute and
  # gives up after 5 hours; once they're approved, running the workflow again tags them and deploys the docs.
  wait:
    needs: publish
    # Also after some packages failed to stage, since an earlier run may have staged them.
    if: ${{ !cancelled() && needs.publish.outputs.waiting == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.publish.outputs.sha }}
      # Only Node: setup-node would look for pnpm, which this job doesn't install, to cache its packages.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - run: node scripts/release.mjs wait --minutes 300

  tag:
    needs: [publish, wait]
    if: ${{ !cancelled() && needs.publish.result != 'skipped' && needs.wait.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the release's tags
    outputs:
      released: ${{ steps.tag.outputs.released }}
      # The commit the release's version was set in, which it's tagged at.
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - id: tag
        run: node scripts/release.mjs tag

  docs:
    needs: tag
    if: ${{ !cancelled() && needs.tag.outputs.released == 'true' }}
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
