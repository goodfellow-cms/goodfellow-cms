# Says on each pull request whether CodeRabbit has reviewed its latest commit, as a commit status named
# "CodeRabbit reviewed". CodeRabbit's own check ends neutral when it's rate limited, and a skipped or neutral check
# looks the same as a passing one in the list of pull requests, so this one fails until CodeRabbit's check on the
# head commit ends in success. Ask for the review with a comment saying "@coderabbitai review".
#
# It passes without a review for drafts (CodeRabbit reviews them once they're ready), Dependabot's pull requests,
# and pull requests labelled no-coderabbit, such as ones over CodeRabbit's file limit. It isn't a required check.
#
# It runs none of the pull request's code: it only reads the pull request and its checks through GitHub's API and
# sets the status, so it uses pull_request_target, which can set statuses on pull requests from forks too. Like
# check_run, that runs the workflow as the default branch has it. Nothing from the event is put into the script
# itself: values reach it through the environment.
name: CodeRabbit reviewed

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  check_run:
    types: [completed]

permissions: {}

concurrency:
  group: coderabbit-reviewed-${{ github.event.pull_request.number || github.event.check_run.head_sha }}
  cancel-in-progress: false

jobs:
  status:
    # Every check run on the repository starts this workflow; only CodeRabbit's matter.
    if: github.event_name == 'pull_request_target' || github.event.check_run.app.slug == 'coderabbitai'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Set the status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECK_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          set -euo pipefail
          context="CodeRabbit reviewed"

          report() { # sha state description url
            gh api --method POST "repos/$REPO/statuses/$1" \
              -f state="$2" -f context="$context" -f description="${3:0:140}" -f target_url="$4" >/dev/null
            echo "$1: $2 ($3)"
          }

          check() { # pull request number
            local pr head url
            pr=$(gh api "repos/$REPO/pulls/$1")
            head=$(jq -r .head.sha <<<"$pr")
            url=$(jq -r .html_url <<<"$pr")
            # A check run for a commit the pull request has moved on from says nothing about it.
            if [ -n "$CHECK_SHA" ] && [ "$CHECK_SHA" != "$head" ]; then return; fi
            if jq -e '.labels | any(.name == "no-coderabbit")' <<<"$pr" >/dev/null; then
              report "$head" success "Not reviewed by CodeRabbit: labelled no-coderabbit" "$url"; return
            fi
            if jq -e .draft <<<"$pr" >/dev/null; then
              report "$head" success "A draft: CodeRabbit reviews it once it's ready" "$url"; return
            fi
            if [ "$(jq -r .user.login <<<"$pr")" = "dependabot[bot]" ]; then
              report "$head" success "Dependabot's: not reviewed by CodeRabbit" "$url"; return
            fi
            local run status conclusion title link
            run=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=CodeRabbit&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "coderabbitai")] | sort_by(.started_at) | last // empty')
            if [ -z "$run" ]; then
              report "$head" pending "Waiting for CodeRabbit" "$url"; return
            fi
            status=$(jq -r .status <<<"$run")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run")
            title=$(jq -r '.output.title // ""' <<<"$run")
            link=$(jq -r .html_url <<<"$run")
            if [ "$status" != completed ]; then
              report "$head" pending "CodeRabbit is reviewing this commit" "$link"
            elif [ "$conclusion" = success ]; then
              report "$head" success "CodeRabbit reviewed this commit" "$link"
            elif [ "$conclusion" = skipped ]; then
              # Such as a pull request over CodeRabbit's file limit, which asking again won't change.
              report "$head" failure "Not reviewed: ${title:-skipped}. Label it no-coderabbit if it can't be" "$link"
            else
              report "$head" failure "Not reviewed: ${title:-$conclusion}. Comment @coderabbitai review" "$link"
            fi
          }

          if [ "$EVENT" = pull_request_target ]; then
            check "$PR_NUMBER"
          else
            # Every open pull request whose head this commit is.
            for number in $(gh api "repos/$REPO/commits/$CHECK_SHA/pulls" --jq '.[] | select(.state == "open") | .number'); do
              check "$number"
            done
          fi
