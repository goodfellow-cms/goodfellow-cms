# Builds the documentation site (docs/) and publishes it with GitHub Pages. The
# release workflow runs it after each release, so the docs describe the latest
# version on npm. To publish a fix to the docs between releases, run it from the
# Actions tab with "master" as the version. In the repository's Settings → Pages,
# "Source" must be "GitHub Actions". See RELEASING.md.
name: Deploy docs

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build the docs from.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: The version to build the docs from, such as v0.2.0 or master. Leave it empty for the latest release.
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Check out the version to build
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF=$(git describe --tags --abbrev=0 --match 'v*' origin/master 2>/dev/null || true)
            if [ -z "$REF" ]; then
              echo "::error::There's no release yet. Run this with \"master\" as the version, or release first."
              exit 1
            fi
          fi
          git checkout --detach "$REF" 2>/dev/null || git checkout --detach "origin/$REF"
          echo "Building the docs from $REF ($(git rev-parse --short HEAD))."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - run: pnpm install --frozen-lockfile
      # The packages the docs site is built with, then the site itself, served from /repository-name/.
      - run: pnpm turbo run build --filter='@goodfellow-cms/docs^...'
      # The starters for the setup page, with lockfiles for the sites it creates: their versions are on npm by now.
      # Releases from before the setup page (0.1.0) don't have it.
      - if: hashFiles('docs/scripts/starters.mjs') != ''
        run: node scripts/starters.mjs
        working-directory: docs
        env:
          GOODFELLOW_STARTER_LOCKFILES: "1"
      - run: pnpm --filter @goodfellow-cms/docs exec goodfellow build --base "${{ steps.pages.outputs.base_path }}/"
      # The Claude Desktop extension, which the Work with Claude page links to. Releases from before it don't have it.
      - if: hashFiles('packages/mcp/scripts/pack-extension.mjs') != ''
        run: |
          pnpm turbo run build --filter='@goodfellow-cms/mcp^...'
          pnpm --filter @goodfellow-cms/mcp pack-extension
          cp packages/mcp/goodfellow.mcpb docs/dist/goodfellow.mcpb
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
