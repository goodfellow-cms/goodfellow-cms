# Builds the documentation site (docs/) and the demo (docs/scripts/demo.mjs, at
# /demo/) and publishes them with GitHub Pages. The release workflow runs it after
# each release, so the docs describe the latest version on npm, and it runs every
# night from the latest release, so the demo's dates stay current. To publish a fix
# to the docs between releases, run it from the Actions tab with "master" as the
# version. In the repository's Settings → Pages, "Source" must be "GitHub Actions".
# See RELEASING.md.
name: Deploy docs

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build the docs from.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: The version to build the docs from, such as v0.2.0 or master. Leave it empty for the latest release.
        type: string
        required: false
  schedule:
    - cron: "23 7 * * *"

# Each job asks for what it needs: the build, which runs the workspace's dependencies, can only read, and only the
# deploy job, which runs none of them, can publish to Pages.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the site's address.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the version to build
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF=$(git describe --tags --abbrev=0 --match 'v*' origin/master 2>/dev/null || true)
            if [ -z "$REF" ]; then
              echo "::error::There's no release yet. Run this with \"master\" as the version, or release first."
              exit 1
            fi
          fi
          git checkout --detach "$REF" 2>/dev/null || git checkout --detach "origin/$REF"
          echo "Building the docs from $REF ($(git rev-parse --short HEAD))."
          # The Sponsors list is the latest, whatever the rest comes from; pages also bring it up to date as they
          # load. Releases from before it don't show it.
          if [ -f .github/sponsors.json ]; then git show origin/master:.github/sponsors.json > .github/sponsors.json; fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile
      # The packages the docs site is built with, then the site itself, served from /repository-name/.
      - run: pnpm turbo run build --filter='@goodfellow-cms/docs^...'
      # The starters for the setup page, with lockfiles for the sites it creates: their versions are on npm by now.
      # Releases from before the setup page (0.1.0) don't have it.
      - if: hashFiles('docs/scripts/starters.mjs') != ''
        run: node scripts/starters.mjs
        working-directory: docs
        env:
          GOODFELLOW_STARTER_LOCKFILES: "1"
      - run: pnpm --filter @goodfellow-cms/docs exec goodfellow build --base "$BASE_PATH/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # The demo: the parish example as this release's create-goodfellow makes it, with the recommended blocks
      # and the Gutenberg plugin, from npm. Releases from before it don't have it.
      - if: hashFiles('docs/scripts/demo.mjs') != ''
        run: node scripts/demo.mjs "$BASE_PATH/demo/" dist/demo
        working-directory: docs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GOODFELLOW_SITE_URL: ${{ steps.pages.outputs.base_url }}/demo
          GOODFELLOW_SIGN_IN_PREVIEW: ${{ runner.temp }}/sign-in-preview
      # The docs' screenshots of the setup page and the demo's admin panel, taken with the runner's Chrome into
      # dist/screenshots/, so they're never kept in the repository.
      - if: hashFiles('docs/scripts/screenshots.mjs') != ''
        run: node scripts/screenshots.mjs dist "$BASE_PATH" "$RUNNER_TEMP/sign-in-preview"
        working-directory: docs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # The Claude Desktop extension, which the Work with Claude page links to. Releases from before it don't have it.
      - if: hashFiles('packages/mcp/scripts/pack-extension.mjs') != ''
        run: |
          pnpm turbo run build --filter='@goodfellow-cms/mcp^...'
          pnpm --filter @goodfellow-cms/mcp pack-extension
          cp packages/mcp/goodfellow.mcpb docs/dist/goodfellow.mcpb
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
