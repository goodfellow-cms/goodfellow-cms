# Builds the site and publishes it with GitLab Pages whenever the default
# branch changes (including every Publish in the admin panel). On scheduled
# pipelines, which the admin panel's Updates screen sets up to run each night,
# it first checks whether the site needs building: when Goodfellow has new
# fixes, which it installs and publishes only if the site still builds with
# them, unless content/updates.json turns automatic updates off; when something
# the site shows by today's date, such as an event, has changed; or when the
# live site isn't the newest build. When it doesn't, it publishes the live
# site's files again, which GitLab Pages needs of a pages job, rather than
# building it. The schedule's GOODFELLOW_NIGHTLY variable "always" builds it
# every night, and the Updates screen turns the schedule off for "never".
# Updating needs "Allow Git push requests to the repository" under Settings →
# CI/CD → Job token permissions, which the Updates screen turns on.
# The admin panel also adds a pipeline schedule for each time a page or item is
# scheduled to be shown or hidden, with GOODFELLOW_SCHEDULED_CHANGE set, and
# starts a pipeline for the Updates screen's Rebuild now, both of which only
# build the site. When package.json names packages package-lock.json doesn't
# have, such as a plugin installed from the admin panel, it writes
# package-lock.json first, installing nothing and running none of their code,
# and publishes it, which also needs that job token permission. Plugins' tasks,
# such as S3 storage signing uploads with keys in the project's CI/CD
# variables, run in the plugin-task job below, in pipelines the admin panel
# starts, which build nothing. See README.md.
variables:
  LOCKFILE_CHECK: 'const fs = require("fs"); const read = (file) => { try { return JSON.parse(fs.readFileSync(file, "utf8")); } catch { return undefined; } }; const site = read("package.json") || {}; const root = ((read("package-lock.json") || {}).packages || {})[""]; const same = (a, b) => JSON.stringify(Object.entries(a || {}).sort()) === JSON.stringify(Object.entries(b || {}).sort()); process.exit(root && ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"].every((key) => same(site[key], root[key])) ? 0 : 1);'
  EARLY_CHECK: 'const fs = require("fs"); let record; try { record = JSON.parse(fs.readFileSync("plugins/installed/installed.json", "utf8")); } catch { process.exit(0); } process.exit(Object.values(record.plugins || {}).some((plugin) => plugin && plugin.early) ? 1 : 0);'

pages:
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/, .next/cache/]
  script:
    # When package.json names packages package-lock.json doesn't have, such as a plugin installed from the
    # admin panel: writes package-lock.json, installing nothing and running none of the packages' code, with
    # releases at least 3 days old for what it adds, and publishes it.
    - |
      if ! node -e "$LOCKFILE_CHECK"; then
        # A plugin installed before it was 3 days old is checked against its provenance first,
        # and the job fails if it doesn't check out.
        if node -e "$EARLY_CHECK"; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund --before="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"; else npm exec --yes --package="@goodfellow-cms/core@$(node -p 'require("./package.json").dependencies["@goodfellow-cms/core"]')" -- goodfellow-early; fi
        git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN:-$CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git -c user.name="Goodfellow" -c user.email=lockfile@goodfellow.invalid commit -m "Write package-lock.json for the packages package.json names" package-lock.json
        git push -o ci.skip origin "HEAD:$CI_COMMIT_BRANCH" || echo "package-lock.json wasn't published: turn on \"Allow Git push requests to the repository\" under Settings → CI/CD → Job token permissions."
      fi
    - npm ci --cache .npm --prefer-offline
    - |
      build=true
      update=false
      if [ -n "$GOODFELLOW_UPDATE" ]; then
        update=true
      elif [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ -z "$GOODFELLOW_SCHEDULED_CHANGE" ]; then
        # Sets build and update; where it can't tell, the site is updated and built as before.
        npx goodfellow-next nightly --output nightly.env && . ./nightly.env || update=true
      fi
    - |
      if [ "$update" = true ]; then
        git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN:-$CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        npx goodfellow-next update --publish --to "${GOODFELLOW_UPDATE:-automatic}" || echo "The update wasn't published; building the site as it is."
      fi
    - |
      if [ "$build" = false ] && curl --fail --silent --show-error --location --header "JOB-TOKEN: $CI_JOB_TOKEN" --output live.zip "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_DEFAULT_BRANCH/download?job=pages" && unzip -q -o live.zip; then
        echo "Publishing the live site's files again, since nothing has changed since they were built."
      else
        # Pages may serve the site from a subfolder, such as https://group.gitlab.io/site/.
        export GOODFELLOW_BASE="$(node -e 'console.log(new URL(process.env.CI_PAGES_URL).pathname)')"
        npm run build
      fi
  pages:
    publish: out
  # A newer publish cancels this build while it runs ("Auto-cancel redundant
  # pipelines" under Settings → CI/CD → General pipelines, on by default) and
  # builds the site with both, so publishes in quick succession mostly cost one
  # build. A nightly update it cancels runs again the next night.
  interruptible: true
  rules:
    - if: $GOODFELLOW_TASK_PLUGIN
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

plugin-task:
  # Runs a plugin's task for the admin panel, such as S3 storage signing uploads
  # with keys kept in the project's CI/CD variables (Settings → CI/CD →
  # Variables), each task getting only those its plugin declared. The admin
  # panel starts a pipeline with GOODFELLOW_TASK_PLUGIN set and reads the
  # answer, sealed to a key only that admin panel holds, from the artifacts.
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npx goodfellow-next task --out goodfellow-task-result.json
  artifacts:
    paths: [goodfellow-task-result.json]
    expire_in: 1 hour
  rules:
    - if: $GOODFELLOW_TASK_PLUGIN
