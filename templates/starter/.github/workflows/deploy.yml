# Builds the site and publishes it with GitHub Pages whenever the main branch
# changes (including every Publish in the admin panel). Each night it checks
# whether the site needs building: when Goodfellow has new fixes, which it
# installs and publishes only if the site still builds with them, unless
# content/updates.json turns automatic updates off; when something the site
# shows by today's date, such as an event, has changed; or when the live site
# isn't the newest build. The repository variable GOODFELLOW_NIGHTLY, which the
# admin panel's Updates screen sets, can make it build every night ("always")
# or not at all ("off"). scheduled.yml also starts it when a page or item
# scheduled to be shown or hidden comes due, and the Updates screen's Rebuild
# now when an owner asks.
# When package.json names packages package-lock.json doesn't have, such as a
# plugin installed from the admin panel, it writes package-lock.json first,
# installing nothing and running none of their code, publishes it, and builds
# the site with it.
# Each job gets only the permissions it needs: the jobs that run the site's
# code can only read the repository, and the jobs that publish run none of it.
# In the repository's Settings → Pages, set "Source" to "GitHub Actions".
# See README.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      update:
        description: "Update Goodfellow first: fixes, latest, or a release such as 0.5.0 (an older one goes back to it). Leave empty to only build."
        required: false
        default: ""

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lockfile:
    # When package.json names packages package-lock.json doesn't have, such as a plugin installed from the
    # admin panel: writes package-lock.json, installing nothing and running none of the packages' code, with
    # releases at least 3 days old for what it adds. publish-lockfile publishes it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.lockfile.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
      - id: lockfile
        env:
          CHECK: 'const fs = require("fs"); const read = (file) => { try { return JSON.parse(fs.readFileSync(file, "utf8")); } catch { return undefined; } }; const site = read("package.json") || {}; const root = ((read("package-lock.json") || {}).packages || {})[""]; const same = (a, b) => JSON.stringify(Object.entries(a || {}).sort()) === JSON.stringify(Object.entries(b || {}).sort()); process.exit(root && ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"].every((key) => same(site[key], root[key])) ? 0 : 1);'
        run: |
          if node -e "$CHECK"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --before="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.lockfile.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: package-lock.json
          retention-days: 1

  publish-lockfile:
    # Publishes the lockfile, without running any of the site's code.
    needs: lockfile
    if: needs.lockfile.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lockfile
      - id: publish
        run: |
          git add package-lock.json
          git -c user.name="Goodfellow" -c user.email=lockfile@goodfellow.invalid commit -m "Write package-lock.json for the packages package.json names"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    # Each night, unless GOODFELLOW_NIGHTLY is "off": whether to build the site, and update Goodfellow first.
    if: github.event_name == 'schedule' && vars.GOODFELLOW_NIGHTLY != 'off'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.nightly.outputs.build }}
      update: ${{ steps.nightly.outputs.update }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - id: nightly
        env:
          GOODFELLOW_NIGHTLY: ${{ vars.GOODFELLOW_NIGHTLY }}
        run: npx goodfellow nightly

  update:
    # When the nightly check finds one, and when the admin panel's Updates screen asks. It installs
    # the update and builds the site with it, but can't publish it: publish-update does.
    # Not while the lockfile is being written: the next night's runs it.
    needs: [check, lockfile]
    if: ${{ !cancelled() && needs.lockfile.outputs.changed != 'true' && ((github.event_name == 'schedule' && needs.check.outputs.update == 'true') || (github.event_name == 'workflow_dispatch' && inputs.update != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.update.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - id: update
        env:
          TO: ${{ inputs.update || 'automatic' }}
        run: npx goodfellow update --commit --to "$TO"
      - if: steps.update.outputs.commit == 'true'
        run: git format-patch --binary --stdout "$GITHUB_SHA" > update.patch
      - if: steps.update.outputs.commit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update
          path: update.patch
          retention-days: 1

  publish-update:
    # Publishes the update the site built with, without running any of its code.
    needs: update
    if: needs.update.outputs.commit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: update
          path: ${{ runner.temp }}
      - id: publish
        env:
          # The update was made where the site's code ran, so only what an update changes is published.
          CHECK: 'const { execFileSync } = require("child_process"); const git = (...args) => execFileSync("git", args, { encoding: "utf8", maxBuffer: 1 << 28 }); const files = ["package.json","package-lock.json","content/updates.json","vercel.json","app/admin/page.tsx","app/admin/editor/page.tsx"]; const folders = ["blocks/installed/","components/","lib/","hooks/"]; const refused = []; const raw = git("diff", "--no-renames", "--raw", "-z", process.env.BASE, "HEAD").split("\0"); for (let i = 0; i + 1 < raw.length; i += 2) { const mode = raw[i].split(" ")[1]; const path = raw[i + 1]; const plain = ["000000", "100644", "100755"].includes(mode); const named = files.includes(path) || folders.some((folder) => path.startsWith(folder)); if (!plain || !named) refused.push(path); } const found = (value, into) => { if (value && typeof value === "object") for (const [key, item] of Object.entries(value)) { if (key === "resolved") into.add(String(item)); else found(item, into); } return into; }; const lock = (rev) => { try { return JSON.parse(git("show", rev + ":package-lock.json")); } catch { return undefined; } }; const before = found(lock(process.env.BASE), new Set()); for (const address of found(lock("HEAD"), new Set())) { if (!before.has(address) && !address.startsWith("https://registry.npmjs.org/")) refused.push("package-lock.json: " + address); } for (const path of refused) console.log("::error::The update changed what an update never does, so it was not published: " + path); process.exit(refused.length > 0 ? 1 : 0);'
        run: |
          base=$(git rev-parse HEAD)
          git -c user.name="Goodfellow updates" -c user.email=updates@goodfellow.invalid am "$RUNNER_TEMP/update.patch"
          BASE="$base" node -e "$CHECK"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, update, publish-update, lockfile, publish-lockfile]
    # At night only when the check says so, or couldn't tell; otherwise always, even when there was
    # no update to run, or it didn't work.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.build == 'true' || needs.check.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The update's or the lockfile's commit, when it published one.
          ref: ${{ needs.publish-update.outputs.sha || needs.publish-lockfile.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Project sites live in a subfolder (/repository-name/); user and organization sites don't.
      - run: npx goodfellow build --base "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
