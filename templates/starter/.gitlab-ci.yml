# Builds the site and publishes it with GitLab Pages whenever the default
# branch changes (including every Publish in the admin panel). On scheduled
# pipelines, which the admin panel's Updates screen sets up to run each night,
# it first installs Goodfellow's newest fixes, unless content/updates.json turns
# automatic updates off (or the release GOODFELLOW_UPDATE names), and publishes
# them only if the site still builds with them. That
# needs "Allow Git push requests to the repository" under Settings → CI/CD →
# Job token permissions, which the Updates screen turns on.
# The admin panel also adds a pipeline schedule for each time a page or item is
# scheduled to be shown or hidden, with GOODFELLOW_SCHEDULED_CHANGE set, which
# only builds the site. See README.md.
pages:
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - |
      if { [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ -z "$GOODFELLOW_SCHEDULED_CHANGE" ]; } || [ -n "$GOODFELLOW_UPDATE" ]; then
        git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN:-$CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        npx goodfellow update --publish --to "${GOODFELLOW_UPDATE:-automatic}" || echo "The update wasn't published; building the site as it is."
      fi
    # Pages may serve the site from a subfolder, such as https://group.gitlab.io/site/.
    - export GOODFELLOW_BASE="$(node -e 'console.log(new URL(process.env.CI_PAGES_URL).pathname)')"
    - npx goodfellow build
  pages:
    publish: dist
  # A newer publish cancels this build while it runs ("Auto-cancel redundant
  # pipelines" under Settings → CI/CD → General pipelines, on by default) and
  # builds the site with both, so publishes in quick succession mostly cost one
  # build. A nightly update it cancels runs again the next night.
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
